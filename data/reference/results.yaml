caveats:
- Three sites and four sessions. Enough to show direction and magnitude, not enough for statistical inference.
  Treat every figure as preliminary.
- No site reported its fairway mowing frequency. Weekly figures use a stated frequency that the reader
  can change; frequency is now a required field for new sites.
- Two of three sites observed only part of their course. Their full-course figures are extrapolated from
  measured rates and assume unobserved fairways resemble observed ones.
- Manual and autonomous runs were recorded on different days, not simultaneously.
- Operators knew they were being timed. Observation bias would make manual mowing look faster than normal,
  which works against the autonomous case rather than for it.
- Only one site measured fairway acreage. The other two are estimated from the pooled autonomous mowing
  rate.
- Only one site reported a loaded wage. Dollar figures elsewhere use a national default.
- No site has reduced headcount or overtime. Labor savings are currently redeployed hours, not cash removed
  from a budget.
