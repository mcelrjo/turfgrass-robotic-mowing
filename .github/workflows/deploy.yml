name: Build and deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install pyyaml pandas openpyxl

      - name: Check data files
        run: python scripts/validate.py

      - name: Recompute survey results from session data
        run: python scripts/analyze.py

      - name: Recompute coefficients from trial CSVs
        run: python scripts/derive.py

      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - run: npm install
        working-directory: site
      - run: npm run build
        working-directory: site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: {path: site/dist}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
